<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="麦麦门店雷达 mcd-store-radar">
  <title>麦麦门店雷达 mcd-store-radar</title>
  <desc>基于麦当劳中国官方 MCP 的门店级可得性检索 Skill：查联名商品附近哪些门店在售，以及主题活动哪家店哪天还有名额。</desc>
  <!--
    配色依据：麦当劳官方品牌手册
      (mcdonalds.cz/static/files/logo/mcdonalds_logomanual.pdf)
      McDonald's Gold   PMS 1235 C  #FFBC0D  —— 主色，大面积铺
      McDonald's Red    PMS 2035 C  #DB0007  —— 点缀，"a little goes a long way"
      Kraft             PMS 2312 C  #B69A81  —— 暖中性，做缓冲与呼吸空间
      Black                         #1A1A1A  —— 文字
    官方比例指引："plenty of breathing room with lots of Gold, Kraft and splashes of Red"
  -->

  <defs>
    <linearGradient id="goldDepth" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFC823"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- 黄金主底 -->
  <rect width="1280" height="400" fill="url(#goldDepth)"/>

  <!-- 顶部 / 底部红条（点缀） -->
  <rect x="0" y="0" width="1280" height="11" fill="#DB0007"/>
  <rect x="0" y="389" width="1280" height="11" fill="#DB0007"/>

  <!-- 右侧 Kraft 圆（呼吸空间 + 暖中性） -->
  <circle cx="1064" cy="200" r="188" fill="#B69A81" fill-opacity="0.26"/>
  <circle cx="1064" cy="200" r="188" fill="none" stroke="#1A1A1A" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- 雷达扇形（红色点缀线条） -->
  <g opacity="0.85">
    <path d="M1064 200 L1064 60 A140 140 0 0 1 1185 130 Z" fill="#DB0007" fill-opacity="0.16"/>
    <circle cx="1064" cy="200" r="140" fill="none" stroke="#DB0007" stroke-opacity="0.34" stroke-width="1.6"/>
    <circle cx="1064" cy="200" r="97" fill="none" stroke="#DB0007" stroke-opacity="0.32" stroke-width="1.6"/>
    <circle cx="1064" cy="200" r="54" fill="none" stroke="#DB0007" stroke-opacity="0.30" stroke-width="1.6"/>
    <path d="M1064 200 L1064 60" stroke="#DB0007" stroke-opacity="0.36" stroke-width="1.6"/>
    <path d="M1064 200 L1185 130" stroke="#DB0007" stroke-opacity="0.36" stroke-width="1.6"/>
    <path d="M1064 200 L943 130" stroke="#DB0007" stroke-opacity="0.36" stroke-width="1.6"/>
    <path d="M1064 200 L1185 270" stroke="#DB0007" stroke-opacity="0.36" stroke-width="1.6"/>
    <path d="M1064 200 L943 270" stroke="#DB0007" stroke-opacity="0.36" stroke-width="1.6"/>
  </g>

  <!-- 门店点位 -->
  <circle cx="1064" cy="200" r="11" fill="#1A1A1A"/>
  <circle cx="1006" cy="140" r="8" fill="#DB0007"/>
  <circle cx="1132" cy="126" r="7" fill="#DB0007"/>
  <circle cx="1146" cy="252" r="8" fill="#1A1A1A" fill-opacity="0.72"/>
  <circle cx="1000" cy="256" r="7" fill="#DB0007" fill-opacity="0.85"/>

  <!-- 左侧文字 -->
  <text x="70" y="108" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="60" font-weight="700" fill="#1A1A1A" letter-spacing="1">麦麦门店雷达</text>
  <text x="72" y="150" font-family="Consolas, Menlo, monospace"
        font-size="21" fill="#DB0007" letter-spacing="5">MCD-STORE-RADAR</text>

  <rect x="70" y="176" width="92" height="5" fill="#DB0007"/>

  <text x="70" y="228" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="26" fill="#1A1A1A">同一款联名，全城可能只有 1 家店在卖。</text>
  <text x="70" y="266" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="26" fill="#1A1A1A">同一个派对，5 公里内也许一家都约不上。</text>

  <text x="70" y="306" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="18" fill="#6B4A22">基于麦当劳中国官方 MCP ｜ 该去哪家店抢 · 该去哪家店约</text>

  <!-- 数据徽章：白调承托，红只用于强调 -->
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="70" y="330" width="200" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="170" y="355" fill="#1A1A1A" text-anchor="middle">5km → 10km 递进检索</text>

    <rect x="284" y="330" width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="374" y="355" fill="#1A1A1A" text-anchor="middle">leftNum 真实余位</text>

    <rect x="478" y="330" width="176" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="566" y="355" fill="#1A1A1A" text-anchor="middle">零第三方包依赖</text>

    <rect x="668" y="330" width="180" height="38" rx="19" fill="#DB0007"/>
    <text x="758" y="355" fill="#FFFFFF" text-anchor="middle">15 项测试通过</text>
  </g>
</svg>
